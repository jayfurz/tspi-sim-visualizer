[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tspi-py"
version = "0.1.0"
description = "Memory-mapped reader for .tspi trajectory files (numpy)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
arrow = ["pyarrow>=14"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["tspi_py"]
