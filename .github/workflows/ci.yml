name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build (Release)
        run: dotnet build src/Tspi.sln -c Release

      - name: Unit + V&V + golden-lock tests
        run: dotnet test src/Tspi.Tests/Tspi.Tests.csproj -c Release

      - name: Determinism gate (run twice, byte-compare)
        run: |
          TSPI="dotnet src/artifacts/bin/Tspi.Cli/Release/net8.0/tspi.dll"
          $TSPI run schemas/examples/intercept.json -o /tmp/a.tspi --quiet
          $TSPI run schemas/examples/intercept.json -o /tmp/b.tspi --quiet
          $TSPI diff /tmp/a.tspi /tmp/b.tspi

      - name: Append + recovery path
        run: |
          TSPI="dotnet src/artifacts/bin/Tspi.Cli/Release/net8.0/tspi.dll"
          $TSPI append /tmp/a.tspi schemas/examples/addendum-late-munition.json
          $TSPI inspect /tmp/a.tspi --chain
          python3 -c "import os; p='/tmp/a.tspi'; os.truncate(p, os.path.getsize(p)-17)"
          $TSPI recover /tmp/a.tspi --apply
          $TSPI inspect /tmp/a.tspi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Schema check (examples + models vs JSON Schemas)
        run: |
          pip install jsonschema referencing
          python scripts/check_schemas.py

      - name: Python reader tests (cross-language golden contract)
        run: |
          pip install -e "tools/tspi_py[test]"
          pytest tools/tspi_py/tests/ -q
